#
# Nostalgy -- a nostalgic dark skin for GNU Midnight Commander.
#
# Port of the Emacs `nostalgy-theme': a DarkSlateGray (#2f4f4f) canvas,
# wheat (#f5deb3) ink, sea greens, burlywood, and a jolt of pure cyan
# for accents, links and search.
#
# Requires a true-color terminal and mc >= 4.8.19.  Run mc as:
#     COLORTERM=truecolor mc
# then pick it in  Options -> Appearance -> nostalgy.
# To install: copy to  ~/.local/share/mc/skins/nostalgy.ini
#
# 256-colour terminals fall back to the nearest xterm-256 colour
# automatically; 16-colour terminals should use the shipped `default'
# skin instead.

[skin]
description = Nostalgy (DarkSlateGray / wheat, X11 early-web palette)
truecolor = true

[Lines]
horiz = ─
vert = │
lefttop = ┌
righttop = ┐
leftbottom = └
rightbottom = ┘
topmiddle = ┬
bottommiddle = ┴
leftmiddle = ├
rightmiddle = ┤
cross = ┼
dhoriz = ─
dvert = │
dlefttop = ┌
drighttop = ┐
dleftbottom = └
drightbottom = ┘
dtopmiddle = ┬
dbottommiddle = ┴
dleftmiddle = ├
drightmiddle = ┤

[core]
_default_ = #f5deb3;#2f4f4f
selected = #f5deb3;#4a6b6b
marked = #f2d64b;#2f4f4f
markselect = #f2d64b;#4a6b6b
gauge = #66cdaa;#375656
input = #f5deb3;#2b4848
inputmark = #4fd0d0;#375656
inputunchanged = #b3ac8f;#2b4848
disabled = #b3ac8f;#2b4848
reverse = #2f4f4f;#f5deb3
header = #7fffd4;#2f4f4f
commandline = #f5deb3;#2f4f4f
commandlinemark = #2f4f4f;#e8d994
shellprompt = #66cdaa;#2f4f4f
hintbar = #b3ac8f;#243c3c
inputhistory = #f5deb3;#2b4848
commandhistory = #f5deb3;#2b4848
shadow = #243c3c;#243c3c
frame = #41615f;#2f4f4f

[dialog]
